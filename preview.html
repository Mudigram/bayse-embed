<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: transparent;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div id="mount"></div>

    <script>
        let embedReady = false
        let pendingMessage = null

        function renderMarket(data) {
            const { slug, variant, currency } = data
            const mount = document.getElementById('mount')
            mount.innerHTML = ''
            const el = document.createElement('bayse-market')
            el.setAttribute('slug', slug)
            el.setAttribute('variant', variant)
            el.setAttribute('currency', currency)
            mount.appendChild(el)
        }

        window.addEventListener('message', function (e) {
            if (e.data?.type !== 'bayse-render') return
            if (embedReady) {
                renderMarket(e.data)
            } else {
                pendingMessage = e.data
            }
        })
    </script>

    <script src="/embed.js"
        onload="embedReady = true; if (pendingMessage) { renderMarket(pendingMessage); pendingMessage = null; }"
        onerror="console.error('embed.js failed to load')"></script>

</body>

</html>
