<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: transparent;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        /* Rolling Loader CSS */
        .rolling-loader {
            width: 28px;
            height: 28px;
            border: 2.5px solid rgba(0, 59, 235, 0.1);
            border-top-color: #003beb;
            border-radius: 50%;
            animation: bayse-spin 0.8s linear infinite;
        }

        @keyframes bayse-spin {
            to { transform: rotate(360deg); }
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #9592A8;
            font-size: 12px;
            font-family: system-ui, -apple-system, sans-serif;
            font-weight: 500;
            padding: 40px 0;
        }
    </style>
</head>

<body>
    <div id="mount">
        <div class="loading-container">
            <div class="rolling-loader"></div>
            <span>Loading preview...</span>
        </div>
    </div>

    <script>
        let embedReady = false
        let pendingMessage = null

        function renderMarket(data) {
            const { slug, variant, currency } = data
            const mount = document.getElementById('mount')
            mount.innerHTML = ''
            const el = document.createElement('bayse-market')
            el.setAttribute('slug', slug)
            el.setAttribute('variant', variant)
            el.setAttribute('currency', currency)
            mount.appendChild(el)
        }

        window.addEventListener('message', function (e) {
            if (e.data?.type !== 'bayse-render') return
            if (embedReady) {
                renderMarket(e.data)
            } else {
                pendingMessage = e.data
            }
        })
    </script>

    <script src="/embed.js"
        onload="embedReady = true; if (pendingMessage) { renderMarket(pendingMessage); pendingMessage = null; }"
        onerror="console.error('embed.js failed to load')"></script>

</body>

</html>
